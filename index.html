<!DOCTYPE html>
<html>

<head>
<title>Kurt C Website</title>
    <style>
        .section {
            background-color: lightgreen; /* Internal CSS */
        }
        .site-header {
            background: black;
            color: white;
            padding: 14px 20px;
        }

        .header-inner {
            display: flex;
            align-items: center;      /* vertically centered */
            justify-content: space-between; /* title left, nav right */
            gap: 16px;
        }

        .site-title {
            margin: 0;
            font-size: 2.5rem; /* 2-3x larger than nav buttons */
            line-height: 1.1;
        }

        .nav {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .nav-btn {
            display: inline-block;
            color: white;
            text-decoration: none;
            background: #222;
            border: 1px solid #444;
            padding: 8px 12px;
            border-radius: 6px;
    
            font-size: 1rem; /* smaller than title */
        }

        .nav-btn:hover {
            background: #333;
        }
    </style>

</head>
<header class="site-header">
    <div class="header-inner">
        <h1 class="site-title">Kurt Cantrell</h1>

        <nav class="nav">
            <a class="nav-btn" href="#about">About</a>
        </nav>
    </div>
</header>
<body>
    <section>
        <div class="section" style="background-color: lightblue;"> <!-- Inline CSS -->
            <h1 id="about">About Me</h1>
            <p>Radiation Effects PhD Student at Vanderbilt University</p>
        </div>
    </section>

</body>
</html>
